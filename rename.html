<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rename & Upload Drive Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Bổ sung thư viện Google API cho Picker -->
    <script src="https://apis.google.com/js/api.js"></script>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --container-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #007bff;
            --accent-color: #6c757d;
            --border-color: #dddddd;
            --item-bg: #f8f9fa;
            --shadow: 0 10px 25px rgba(0,0,0,0.05);
            --danger-color: #ff4d4d;
            --success-color: #28a745;
        }

        [data-theme="dark"] {
            --bg-color: #18191a;
            --container-bg: #242526;
            --text-color: #e4e6eb;
            --primary-color: #2d88ff;
            --accent-color: #b0b3b8;
            --border-color: #3e4042;
            --item-bg: #3a3b3c;
            --shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* SPLASH SCREEN STYLES */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--container-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .splash-logo {
            font-size: 3rem;
            margin-bottom: 20px;
            filter: drop-shadow(0 5px 15px rgba(0,123,255,0.3));
        }
        .progress-container {
            width: 250px;
            height: 6px;
            background: var(--item-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), #00c6ff);
            border-radius: 10px;
            transition: width 0.1s linear;
        }
        .splash-text {
            margin-top: 15px;
            font-weight: 600;
            color: var(--accent-color);
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--container-bg);
            padding: 35px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            display: none; /* Ẩn lúc đầu để splash screen chạy */
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .config-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
        }

        .input-box {
            flex: 1;
            min-width: 120px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label { font-weight: 600; font-size: 0.8em; color: var(--accent-color); text-transform: uppercase; letter-spacing: 0.5px;}

        select, input {
            height: 42px;
            padding: 0 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--container-bg);
            color: var(--text-color);
            font-size: 14px;
            width: 100%;
        }

        .input-with-clear { position: relative; display: flex; align-items: center; }
        .input-with-clear input { padding-right: 35px; }
        .btn-clear-input {
            position: absolute; right: 8px; background: none; border: none;
            color: var(--accent-color); cursor: pointer; font-size: 18px; display: none;
        }
        .input-with-clear:hover .btn-clear-input { display: block; }

        .drive-config {
            background: var(--item-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }

        .drive-status { font-size: 0.85em; font-weight: 600; display: flex; align-items: center; gap: 5px; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent-color); }
        .status-connected .status-dot { background: var(--success-color); }

        .btn-primary {
            background: var(--primary-color); color: white; border: none;
            padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600;
        }

        .btn-upload { width: 100%; margin-top: 15px; height: 50px; font-size: 1.1em; display: flex; align-items: center; justify-content: center; gap: 10px; }

        .preview-area {
            background: var(--item-bg); padding: 18px; border-radius: 10px;
            margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center;
        }

        #dropzone {
            border: 2px dashed var(--primary-color); border-radius: 12px;
            padding: 40px 20px; text-align: center; cursor: pointer; margin-bottom: 25px;
            position: relative;
        }
        #dropzone.dragover {
            background-color: rgba(0, 123, 255, 0.1);
            border-color: var(--success-color);
        }

        .file-list { list-style: none; padding: 0; max-height: 400px; overflow-y: auto; }
        .file-item {
            background: var(--item-bg); margin-bottom: 12px; padding: 12px 18px;
            border-radius: 10px; display: flex; justify-content: space-between; align-items: center;
            border: 1px solid var(--border-color);
        }
        .file-thumb { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; margin-right: 15px; }
        .file-info { flex: 1; }
        .new-name { font-weight: 700; color: var(--primary-color); display: block; }
        .old-name { color: var(--accent-color); font-size: 0.75em; }

        .modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content { background: var(--container-bg); padding: 25px; border-radius: 12px; text-align: center; width: 90%; max-width: 400px; box-shadow: var(--shadow); }
        
        .loader { display: none; border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid var(--primary-color); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 10px auto; }
        .btn-upload .loader { width: 20px; height: 20px; border-top-color: white; margin: 0; }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .uppercase { text-transform: uppercase; }
        
        .btn-picker {
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 15px;
            cursor: pointer;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .btn-picker:hover { background: var(--primary-color); }
        .folder-input-group { display: flex; gap: 8px; width: 100%; }
    </style>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>

<!-- BỔ SUNG HTML SPLASH SCREEN -->
<div id="splash-screen">

    <div class="progress-container">
        <div class="progress-bar" id="splash-bar"></div>
    </div>

</div>

<div class="container animate__animated animate__fadeIn" id="main-app">

    <div class="drive-config">

                <label>Client ID</label>
                <div class="input-with-clear">

        </div>

    <div class="config-grid">
        <div class="input-box">
            <label id="lbl-prefix">Tiền tố</label>
            <select id="prefix">

                <option value="ZL">ZL</option>

                <option value="FT">FT</option>

            <label id="lbl-code">Mã (Code)</label>

            <label id="lbl-street">Đường</label>
            <input type="text" id="streetInput" class="uppercase" placeholder="GD">
        </div>
        <div class="input-box">
            <label id="lbl-ward">Phường</label>
            <input type="text" id="wardInput" class="uppercase" placeholder="TP">
        </div>
    </div>

    <div class="preview-area">
        <div>
            <span id="lbl-preview">Xem trước:</span> 
            <strong id="namePreview" style="color: var(--primary-color); margin-left: 5px;"></strong>
            <button onclick="resetNamingConfig()" style="background:none; border:1px solid #ccc; cursor:pointer; font-size:10px; margin-left:10px; border-radius:4px;">↺ Reset</button>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
            <button class="btn-primary" style="background:var(--danger-color); padding:5px 10px; font-size:0.8em;" id="btnClearAll" onclick="confirmClearAll()">Xóa tất cả</button>
            <span style="font-size: 0.85em; font-weight:600;"><span id="lbl-count-text">Số file:</span> <span id="fileCountDisplay">0</span></span>
        </div>
    </div>

    <div id="dropzone">
        <p id="txt-drop">Kéo thả ảnh vào đây hoặc Click để chọn file</p>

    </div>

    <ul class="file-list" id="fileList"></ul>

    <button id="btnUploadDrive" class="btn-primary btn-upload" style="display: none;" onclick="uploadAllToDrive()">
        <div class="loader" id="uploadLoader"></div>
        <span id="btnUploadText">🚀 Tải lên Google Drive</span>

</div>

<div id="customModal" class="modal-overlay">
    <div class="modal-content">
        <h3 id="modalTitle">Thông báo</h3>
        <p id="modalMsg"></p>
        <div id="modalBtns" style="margin-top:20px; display:flex; justify-content:center; gap:10px;"></div>
    </div>
</div>
<script src="./connectivity-monitor.js"></script>
<script>
// --- LOGIC SPLASH SCREEN ---
function startSplashScreen() {
    const splash = document.getElementById('splash-screen');
    const bar = document.getElementById('splash-bar');
    const app = document.getElementById('main-app');
    let width = 0;
    const duration = 3500; // 3.5 giây
    const intervalTime = 35; 
    const step = 100 / (duration / intervalTime);

    const timer = setInterval(() => {
        width += step;
        bar.style.width = width + '%';
        if (width >= 100) {
            clearInterval(timer);
            // Hiệu ứng ẩn splash screen
            splash.classList.add('animate__animated', 'animate__fadeOut');
            setTimeout(() => {
                splash.style.display = 'none';
                app.style.display = 'block'; // Hiện giao diện chính
            }, 800);
        }
    }, intervalTime);
}

const translations = {
    vi: {
        title: "Rename & Upload Drive",
        prefix: "Tiền tố",
        code: "Mã (Code)",
        order: "Thứ tự",
        street: "Đường",

        remove: "Xóa",
        clearAll: "Xóa tất cả",
        connect: "Kết nối Drive",
        connected: "Đã kết nối",
        notConnected: "Chưa kết nối",

        preview: "Preview:",

        close: "Close",

        themeDevice: "System"

};

let filesArray = [];
let accessToken = null;
let pickerApiLoaded = false;

gapi.load('picker', () => { pickerApiLoaded = true; });

function showPicker() {
    const lang = localStorage.getItem('app-lang') || 'vi';
    if (!accessToken) {
        showModal(translations[lang].needConnect);
        return;
    }
    createPicker();
}

function createPicker() {
    if (pickerApiLoaded && accessToken) {
        const apiKey = document.getElementById('apiKey').value.trim();
        const view = new google.picker.DocsView(google.picker.ViewId.FOLDERS)
            .setIncludeFolders(true)
            .setSelectFolderEnabled(true)
            .setMimeTypes('application/vnd.google-apps.folder');

        const picker = new google.picker.PickerBuilder()
            .addView(view)
            .setOAuthToken(accessToken)
            .setDeveloperKey(apiKey)
            .setCallback(pickerCallback)
            .build();
        picker.setVisible(true);
    }
}

function pickerCallback(data) {
    if (data.action === google.picker.Action.PICKED) {
        const doc = data.docs[0];
        const folderIdInput = document.getElementById('folderId');
        folderIdInput.value = doc.id;
        fetchFolderName();
    }
}

function showModal(msg, type = 'alert', onConfirm = null) {
    const modal = document.getElementById('customModal');
    const titleEl = document.getElementById('modalTitle');
    const msgEl = document.getElementById('modalMsg');
    const btnContainer = document.getElementById('modalBtns');
    const lang = localStorage.getItem('app-lang') || 'vi';
    const t = translations[lang];

    titleEl.innerText = t.modalTitle;
    msgEl.innerText = msg;
    btnContainer.innerHTML = '';

    if (type === 'alert') {
        const btn = document.createElement('button');
        btn.className = 'btn-primary';
        btn.innerText = t.close;
        btn.onclick = () => modal.style.display = 'none';
        btnContainer.appendChild(btn);
    } else if (type === 'confirm') {
        const btnOk = document.createElement('button');
        btnOk.className = 'btn-primary';
        btnOk.innerText = t.confirm;
        btnOk.onclick = () => { modal.style.display = 'none'; if(onConfirm) onConfirm(); };
        
        const btnCancel = document.createElement('button');
        btnCancel.className = 'btn-primary';
        btnCancel.style.background = 'var(--accent-color)';
        btnCancel.innerText = t.cancel;
        btnCancel.onclick = () => modal.style.display = 'none';
        
        btnContainer.appendChild(btnOk);
        btnContainer.appendChild(btnCancel);
    }
    modal.style.display = 'flex';
}

window.onload = () => {
    // Chạy Splash Screen đầu tiên
    startSplashScreen();

    const savedLang = localStorage.getItem('app-lang') || 'vi';
    document.getElementById('langSelector').value = savedLang;
    setLang(savedLang);
    
    const savedTheme = localStorage.getItem('app-theme') || 'light';
    document.getElementById('themeSelector').value = savedTheme;
    setTheme(savedTheme);

    loadSavedConfig();
    updatePreview();
    initSortable();
    initDragAndDrop();

    document.getElementById('folderId').addEventListener('input', fetchFolderName);
    
    const codeInput = document.getElementById('codeInput');
    codeInput.addEventListener('input', (e) => {
        let val = e.target.value;
        if (val.length > 6) { e.target.value = val.slice(-6); }
        updatePreview();
        renderFileList();
    });
};

function initDragAndDrop() {
    const dropzone = document.getElementById('dropzone');
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
        dropzone.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
    });
    ['dragenter', 'dragover'].forEach(eventName => {
        dropzone.addEventListener(eventName, () => dropzone.classList.add('dragover'), false);
    });
    ['dragleave', 'drop'].forEach(eventName => {
        dropzone.addEventListener(eventName, () => dropzone.classList.remove('dragover'), false);
    });
    dropzone.addEventListener('drop', (e) => { handleFiles(e.dataTransfer.files); }, false);
}

function loadSavedConfig() {
    document.getElementById('clientId').value = localStorage.getItem('drive-client-id') || '';
    document.getElementById('apiKey').value = localStorage.getItem('drive-api-key') || '';
    document.getElementById('folderId').value = localStorage.getItem('drive-folder-id') || '';
}

function clearInput(id) {
    document.getElementById(id).value = '';
    localStorage.removeItem('drive-' + id.replace(/[A-Z]/g, m => "-" + m.toLowerCase()));
    if(id === 'folderId') document.getElementById('folderNameDisplay').innerText = '';
}

function setLang(lang) {
    localStorage.setItem('app-lang', lang);
    const t = translations[lang];
    document.getElementById('txt-title').innerText = t.title;
    document.getElementById('lbl-prefix').innerText = t.prefix;
    document.getElementById('lbl-code').innerText = t.code;
    document.getElementById('lbl-order').innerText = t.order;
    document.getElementById('lbl-street').innerText = t.street;
    document.getElementById('lbl-ward').innerText = t.ward;
    document.getElementById('lbl-preview').innerText = t.preview;
    document.getElementById('txt-drop').innerText = t.drop;
    document.getElementById('lbl-count-text').innerText = t.countText;
    document.getElementById('btnClearAll').innerText = t.clearAll;
    document.getElementById('lbl-drive-config').innerText = t.driveConfig;
    document.getElementById('lbl-folder-link').innerText = t.folderLink;
    document.getElementById('btn-connect-drive').innerText = t.connect;
    document.getElementById('statusText').innerText = accessToken ? t.connected : t.notConnected;
    document.getElementById('modalTitle').innerText = t.modalTitle;
    document.getElementById('opt-light').innerText = t.themeLight;
    document.getElementById('opt-dark').innerText = t.themeDark;
    document.getElementById('opt-device').innerText = t.themeDevice;
    document.getElementById('clientId').placeholder = t.placeholderClientId;
    document.getElementById('apiKey').placeholder = t.placeholderApiKey;
    document.getElementById('folderId').placeholder = t.placeholderFolder;
    document.getElementById('btnUploadText').innerText = t.uploadButton;
    renderFileList();
}

function setTheme(theme) {
    localStorage.setItem('app-theme', theme);
    if (theme === 'device') {
        const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    } else {
        document.documentElement.setAttribute('data-theme', theme);
    }
}

function extractFolderId(input) {
    if (!input) return null;
    const match = input.match(/(?:folders\/|id=)([a-zA-Z0-9-_]{25,})/);
    return match ? match[1] : input.trim();
}

async function fetchFolderName() {
    const input = document.getElementById('folderId').value.trim();
    const display = document.getElementById('folderNameDisplay');
    const lang = localStorage.getItem('app-lang') || 'vi';
    if (!input) { display.innerText = ''; return; }
    if (!accessToken) { 
        display.innerText = translations[lang].needConnect; 
        display.style.color = "orange";
        return; 
    }
    const folderId = extractFolderId(input);
    if (folderId.length < 20) return;
    display.innerText = translations[lang].fetching;
    display.style.color = "var(--accent-color)";
    try {
        const res = await fetch(`https://www.googleapis.com/drive/v3/files/${folderId}?fields=name`, {
            headers: { 'Authorization': 'Bearer ' + accessToken }
        });
        if (res.ok) {
            const data = await res.json();
            display.innerText = "📁 " + data.name;
            display.style.color = "var(--success-color)";
        } else {
            display.innerText = translations[lang].notFound;
            display.style.color = "var(--danger-color)";
        }
    } catch { display.innerText = "Error"; }
}

function handleAuthClick() {
    const cid = document.getElementById('clientId').value.trim();
    const key = document.getElementById('apiKey').value.trim();
    const lang = localStorage.getItem('app-lang') || 'vi';
    if (!cid || !key) { showModal(translations[lang].errorMissing); return; }
    localStorage.setItem('drive-client-id', cid);
    localStorage.setItem('drive-api-key', key);
    const client = google.accounts.oauth2.initTokenClient({
        client_id: cid,
        scope: 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.metadata.readonly https://www.googleapis.com/auth/drive.readonly',
        callback: (res) => {
            if (res.access_token) {
                accessToken = res.access_token;
                document.getElementById('driveStatus').classList.add('status-connected');
                setLang(localStorage.getItem('app-lang') || 'vi');
                fetchFolderName();
                renderFileList();
            }
        },
    });
    client.requestAccessToken();
}

function generateFileName(index, originalName) {
    const prefix = document.getElementById('prefix').value;
    if (prefix === 'None') return "";
    const ext = originalName.split('.').pop();
    const code = document.getElementById('codeInput').value.toUpperCase();
    const order = document.getElementById('orderSelect').value;
    const street = document.getElementById('streetInput').value.toUpperCase();
    const ward = document.getElementById('wardInput').value.toUpperCase();
    let parts = [prefix, code];
    if (order !== 'none') parts.push(index + 1);
    if (street) parts.push(street);
    if (ward) parts.push(ward);
    return parts.filter(p => p !== "").join('.') + "." + ext;
}

function updatePreview() {
    const preview = generateFileName(0, "image.jpg").replace(".jpg", "");
    document.getElementById('namePreview').innerText = preview;
}

function renderFileList() {
    const list = document.getElementById('fileList');
    const lang = localStorage.getItem('app-lang') || 'vi';
    list.innerHTML = '';
    document.getElementById('fileCountDisplay').innerText = filesArray.length;
    filesArray.forEach((file, i) => {
        const li = document.createElement('li');
        li.className = 'file-item animate__animated animate__fadeIn';
        const newName = generateFileName(i, file.name);
        const thumb = URL.createObjectURL(file);
        li.innerHTML = `
            <img src="${thumb}" class="file-thumb">
            <div class="file-info">
                <span class="new-name">${newName || file.name}</span>
                <span class="old-name">${file.name}</span>
            </div>
            <button class="btn-primary" style="background:var(--danger-color); padding:5px;" onclick="removeFile(${i})">${translations[lang].remove}</button>
        `;
        list.appendChild(li);
    });
    document.getElementById('btnUploadDrive').style.display = (filesArray.length > 0 && accessToken) ? 'flex' : 'none';
}

function handleFiles(files) {
    const loader = document.getElementById('loader');
    const dropText = document.getElementById('txt-drop');
    loader.style.display = 'block';
    loader.style.borderColor = 'transparent';
    loader.style.borderTopColor = 'var(--primary-color)';
    dropText.style.opacity = '0.3';
    setTimeout(() => {
        filesArray = [...filesArray, ...Array.from(files)];
        const order = document.getElementById('orderSelect').value;
        if (order === 'asc') filesArray.sort((a,b) => a.name.localeCompare(b.name));
        if (order === 'desc') filesArray.sort((a,b) => b.name.localeCompare(a.name));
        renderFileList();
        loader.style.display = 'none';
        dropText.style.opacity = '1';
    }, 300);
}

function removeFile(i) { filesArray.splice(i, 1); renderFileList(); }

function confirmClearAll() {
    const lang = localStorage.getItem('app-lang') || 'vi';
    showModal(translations[lang].confirmClear, 'confirm', () => {
        filesArray = [];
        renderFileList();
    });
}

async function uploadAllToDrive() {
    const folderId = extractFolderId(document.getElementById('folderId').value);
    const btn = document.getElementById('btnUploadDrive');
    const btnText = document.getElementById('btnUploadText');
    const uploadLoader = document.getElementById('uploadLoader');
    const lang = localStorage.getItem('app-lang') || 'vi';
    const t = translations[lang];
    
    btn.disabled = true;
    btnText.innerText = t.uploading;
    uploadLoader.style.display = 'block';

    try {
        for (let i = 0; i < filesArray.length; i++) {
            const file = filesArray[i];
            const name = generateFileName(i, file.name);
            const metadata = { name: name, parents: [folderId] };
            const form = new FormData();
            form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
            form.append('file', file);

            await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + accessToken },
                body: form
            });
        }
        showModal(t.uploadSuccess);
    } catch (e) { showModal("Error: " + e.message); }
    finally {
        btn.disabled = false;
        btnText.innerText = t.uploadButton;
        uploadLoader.style.display = 'none';
    }
}

document.getElementById('dropzone').onclick = (e) => {
    if(e.target.id === 'dropzone' || e.target.id === 'txt-drop') { document.getElementById('fileInput').click(); }
};
document.getElementById('fileInput').onchange = (e) => handleFiles(e.target.files);
document.getElementById('themeSelector').onchange = (e) => setTheme(e.target.value);
document.getElementById('langSelector').onchange = (e) => setLang(e.target.value);
['prefix', 'orderSelect', 'streetInput', 'wardInput'].forEach(id => {
    document.getElementById(id).oninput = () => { updatePreview(); renderFileList(); };
});

function initSortable() {
    new Sortable(document.getElementById('fileList'), {
        animation: 150,
        onEnd: () => {
            const newList = [];
            document.querySelectorAll('.file-item').forEach(el => {
                const oldName = el.querySelector('.old-name').innerText;
                const file = filesArray.find(f => f.name === oldName);
                if(file) newList.push(file);
            });
            filesArray = newList;
            renderFileList();
        }
    });
}

function resetNamingConfig() {
    document.getElementById('prefix').value = 'None';
    document.getElementById('codeInput').value = '';
    document.getElementById('streetInput').value = '';
    document.getElementById('wardInput').value = '';
    updatePreview(); renderFileList();
}
</script>
